<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Brief</title>
<link rel="manifest" href="/ui/manifest.webmanifest">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Morning Brief">
<link rel="apple-touch-icon" href="/ui/icon-192.png">
<link rel="icon" href="/ui/icon-192.png">
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel-2:#1c2430; --line:#2a3441;
    /* --line is decorative (dividers, card edges) at 1.37:1. Anything that is
       the visible boundary of a control needs 3:1 per WCAG 1.4.11, so those
       use --line-strong, measured at 3.92:1 on panel and 3.54:1 on panel-2. */
    --line-strong:#667a91;
    --ink:#e6edf3; --dim:#8b97a6; --accent:#f0a05a; --accent-2:#5aa8f0;
    --ok:#4ec98a; --bad:#f0605a; --warn:#e3c05a; --radius:12px;
  }
  *{box-sizing:border-box}

  /* Respect the OS "reduce motion" setting: vestibular disorders make sliding
     panels and transforms genuinely unpleasant, not just distracting. */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important; scroll-behavior:auto !important;
    }
  }
  body{margin:0; background:var(--bg); color:var(--ink);
       font:15px/1.55 "Segoe UI",system-ui,sans-serif}
  a{color:inherit; text-decoration:none}

  header{
    padding:20px 24px 16px; border-bottom:1px solid var(--line);
    display:flex; align-items:flex-start; gap:22px; flex-wrap:wrap;
  }
  .hello h1{margin:0; font-size:24px; font-weight:600; letter-spacing:.2px}
  .hello p{margin:3px 0 0; color:var(--dim); font-size:13.5px}
  .wx{display:flex; align-items:center; gap:14px; margin-left:auto}
  .wx .temp{font-size:34px; font-weight:600; line-height:1}
  .wx .meta{color:var(--dim); font-size:13px}
  .wx .meta strong{color:var(--ink); font-weight:500}

  main{
    max-width:1400px; margin:0 auto; padding:22px 24px 110px;
    display:grid; gap:18px; grid-template-columns:minmax(320px,1.15fr) minmax(280px,.85fr);
  }
  @media (max-width:900px){ main{grid-template-columns:1fr} }
  .card{background:var(--panel); border:1px solid var(--line);
        border-radius:var(--radius); padding:18px 20px}
  .card h2{font-size:13px; text-transform:uppercase; letter-spacing:.09em;
           color:var(--accent); margin:0 0 14px; display:flex; align-items:center; gap:10px}
  .card h2 .right{margin-left:auto; display:flex; gap:6px; align-items:center}

  button{background:var(--panel-2); color:var(--ink); border:1px solid var(--line-strong);
         border-radius:8px; padding:7px 12px; font:inherit; font-size:13px; cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent-2); color:#fff}
  button.icon{padding:6px 10px; line-height:1}
  button.on{background:var(--accent); color:#14161a; border-color:var(--accent); font-weight:600}

  /* calendar */
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .cal-grid .dow{color:var(--dim); font-size:11px; text-align:center;
                 text-transform:uppercase; letter-spacing:.06em; padding-bottom:4px}
  /* Calendar days and queue rows are <button> so a keyboard can reach them.
     These resets keep them looking exactly as they did as <div>s. */
  .day, .qitem{
    font:inherit; text-align:left; width:100%; color:inherit;
    -webkit-appearance:none; appearance:none;
  }
  /* A visible focus ring is the whole point of making these focusable. */
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .day{
    aspect-ratio:1/1; border:1px solid transparent; border-radius:8px;
    background:var(--panel-2); padding:5px 6px; cursor:pointer;
    display:flex; flex-direction:column; gap:3px; min-height:44px;
  }
  .day:hover{border-color:var(--accent-2)}
  .day.blank{background:transparent; cursor:default}
  /* Out-of-term days were opacity:.4, which dropped the date to 1.93:1 -
     unreadable. Fading text is a poor way to say "different": a dashed,
     hollow cell carries the same meaning at full legibility (and the reason
     is in the button's aria-label anyway). */
  .day.out{background:transparent; border-style:dashed; border-color:var(--line-strong)}
  .day.today{border-color:var(--accent)}
  .day.sel{background:#243040; border-color:var(--accent-2)}
  .day .n{font-size:12.5px; color:var(--dim)}
  .day.today .n{color:var(--accent); font-weight:700}
  .dots{display:flex; gap:3px; flex-wrap:wrap; margin-top:auto}
  .dot{width:5px; height:5px; border-radius:50%}
  .dot.cls{background:var(--accent-2)} .dot.ev{background:var(--ok)}
  .daybox{margin-top:14px; border-top:1px solid var(--line); padding-top:12px}
  .daybox h3{margin:0 0 8px; font-size:14px; font-weight:600}
  .line{display:flex; gap:10px; padding:5px 0; font-size:13.5px; align-items:baseline}
  .line .t{color:var(--accent-2); flex:none; min-width:96px; font-variant-numeric:tabular-nums}
  .line .t.ev{color:var(--ok)}
  .line .w{color:var(--dim); margin-left:auto; font-size:12.5px}

  /* todos */
  .todo-add{display:flex; gap:8px; margin-bottom:12px}
  .todo-add input{flex:1; background:var(--panel-2); color:var(--ink);
                  border:1px solid var(--line-strong); border-radius:8px; padding:8px 11px; font:inherit}
  .todo-add input:focus{outline:none; border-color:var(--accent-2)}
  .todo{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line)}
  .todo:last-child{border-bottom:none}
  .todo input[type=checkbox]{accent-color:var(--accent); width:16px; height:16px; flex:none; cursor:pointer}
  .todo .txt{flex:1; outline:none; border-radius:4px; padding:2px 4px; font-size:14px}
  .todo .txt:focus{background:var(--panel-2)}
  .todo.done .txt{text-decoration:line-through; color:var(--dim)}
  .todo .del{opacity:0; border:none; background:none; color:var(--dim); cursor:pointer; font-size:16px}
  .todo:hover .del{opacity:1}
  .todo .del:hover{color:var(--bad)}
  .empty{color:var(--dim); font-size:13.5px; padding:10px 0}

  /* news */
  .news{grid-column:1 / -1}
  .cards{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  /* Deliberately left on the decorative --line: a story is identified by its
     headline text (5.3:1), not by its card edge, so WCAG 1.4.11 does not
     apply to this border. Outlining every card would also make the news
     grid read as a wall of boxes. */
  .story{
    display:flex; flex-direction:column; background:var(--panel-2);
    border:1px solid var(--line); border-radius:10px; padding:14px 15px;
    transition:border-color .15s, transform .15s;
    /* Anchor for the headline's click overlay, below. */
    position:relative;
  }
  .story:hover{border-color:var(--accent); transform:translateY(-2px)}
  .story .src{font-size:11px; text-transform:uppercase; letter-spacing:.07em;
              color:var(--accent); margin-bottom:6px;
              display:flex; align-items:center; gap:8px; flex-wrap:wrap}

  /* Stories the presenter actually read out this morning. The marker is a
     badge and a coloured edge rather than a colour change on its own -
     colour alone would carry the meaning for people who can't see it, and
     the badge text is what a screen reader announces. */
  .story.spoken{border-color:var(--accent-2)}
  .story.spoken:hover{border-color:var(--accent)}
  .badge{
    font-size:10px; letter-spacing:.06em; font-weight:600; white-space:nowrap;
    color:#14161a; background:var(--accent-2); border-radius:99px; padding:2px 8px;
  }
  .news h2 .count{color:var(--accent-2); text-transform:none; letter-spacing:0;
                  font-size:12.5px; font-weight:500}
  .story .hl{font-size:14.5px; line-height:1.45; font-weight:500}
  /* The whole card opens the story, but only the headline is a link in the
     accessibility tree - a button can't live inside an <a>, and screen-reader
     users shouldn't meet the same destination twice. The overlay gives the
     card its big click target without duplicating the link. */
  a.hl::after{content:""; position:absolute; inset:0; border-radius:10px}
  a.hl{color:inherit; text-decoration:none}
  .story .sm{font-size:12.5px; color:var(--dim); margin-top:7px; line-height:1.5}
  .story.nolink{cursor:default} .story.nolink:hover{transform:none; border-color:var(--line)}

  /* Controls must sit above the overlay or the card link swallows the click. */
  .story-foot{margin-top:auto; padding-top:11px; display:flex; justify-content:flex-end;
              position:relative; z-index:1}
  .listen{font-size:12px; padding:5px 11px; display:inline-flex; align-items:center; gap:6px}
  .listen[aria-busy="true"]{color:var(--accent); border-color:var(--accent)}
  .listen:disabled{opacity:.55}

  /* now-reading panel */
  .reading{
    border:1px solid var(--accent); border-radius:10px; background:var(--panel-2);
    padding:14px 16px; margin-bottom:14px;
  }
  .reading .top{display:flex; align-items:flex-start; gap:12px; margin-bottom:8px}
  .reading .who{font-size:11px; text-transform:uppercase; letter-spacing:.07em;
                color:var(--accent)}
  .reading .what{font-size:14.5px; font-weight:500; line-height:1.4}
  .reading .state{font-size:12.5px; color:var(--dim); margin-top:3px}
  .reading .acts{margin-left:auto; display:flex; gap:6px; flex:none}
  .reading .script{
    font-size:13.5px; line-height:1.62; color:var(--ink); white-space:pre-wrap;
    max-height:230px; overflow:auto; border-top:1px solid var(--line);
    padding-top:10px; margin-top:4px;
  }
  .reading .note{font-size:12px; color:var(--warn); margin-top:8px}

  /* player */
  footer{
    position:fixed; bottom:0; left:0; right:0; background:rgba(14,17,22,.96);
    backdrop-filter:blur(10px); border-top:1px solid var(--line);
    padding:11px 24px; display:flex; align-items:center; gap:16px; z-index:30;
  }
  footer img{width:44px; height:44px; border-radius:6px; background:var(--panel-2); flex:none}
  .np{min-width:0}
  .np .t{font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .np .a{font-size:12.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .transport{display:flex; gap:7px; align-items:center}
  #vol{width:96px; accent-color:var(--accent)}

  /* progress / seek */
  .progress{display:flex; align-items:center; gap:10px; flex:1; min-width:180px; margin:0 8px}
  .progress .time{font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums; min-width:38px}
  .progress .time:last-child{text-align:right}
  .progress .track{
    position:relative; flex:1; height:5px; background:var(--panel-2);
    border-radius:99px; cursor:pointer;
  }
  .progress .track:hover{height:7px}
  .progress .fill{height:100%; width:0; background:var(--accent); border-radius:99px}
  .progress .knob{
    position:absolute; top:50%; left:0; width:11px; height:11px; border-radius:50%;
    background:var(--accent); transform:translate(-50%,-50%); opacity:0; transition:opacity .15s;
  }
  .progress .track:hover .knob{opacity:1}
  @media (max-width:760px){ .progress{display:none} }

  /* queue panel */
  #queuePanel{
    position:fixed; top:0; right:0; bottom:0; width:330px; max-width:88vw; z-index:35;
    background:var(--panel); border-left:1px solid var(--line);
    transform:translateX(100%); transition:transform .22s ease;
    display:flex; flex-direction:column;
  }
  #queuePanel.open{transform:translateX(0)}
  #queuePanel .qhead{
    display:flex; align-items:center; gap:10px; padding:15px 16px;
    border-bottom:1px solid var(--line);
  }
  #queuePanel .qhead span{color:var(--dim); font-size:12.5px; margin-left:auto}
  #queueList{overflow-y:auto; padding:6px 0 90px}
  .qitem{
    display:flex; align-items:center; gap:11px; padding:8px 16px; cursor:pointer;
    border:none; border-left:2px solid transparent; background:none; border-radius:0;
  }
  .qitem:hover{background:var(--panel-2)}
  .qitem.now{border-left-color:var(--accent); background:var(--panel-2)}
  .qitem img{width:36px; height:36px; border-radius:4px; background:var(--panel-2); flex:none}
  /* These were divs; as spans inside a button they need to stack explicitly. */
  .qitem .qt{min-width:0; flex:1; display:block}
  .qitem .qn{display:block; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .qitem.now .qn{color:var(--accent); font-weight:600}
  .qitem .qa{display:block; font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .qitem .qd{font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums; flex:none}
  .toast{position:fixed; bottom:84px; left:50%; transform:translateX(-50%);
         background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
         padding:10px 17px; font-size:13.5px; z-index:40; opacity:0; transition:opacity .2s}
  .toast.show{opacity:1}
  .toast.bad{border-color:var(--bad); color:#f8c3c0}
</style>
</head>
<body>

<header>
  <div class="hello">
    <h1 id="greeting">Good morning</h1>
    <p id="subtitle">Loading your briefing…</p>
  </div>
  <div class="wx" id="wx"></div>
  <!-- Styled as a button, so its box is what identifies it as a control: 3:1 line. -->
  <a href="/" style="align-self:center; color:var(--dim); font-size:13px; border:1px solid var(--line-strong);
     padding:7px 13px; border-radius:8px">Settings ⚙</a>
</header>

<main>
  <!-- calendar --------------------------------------------------------- -->
  <section class="card">
    <h2>Calendar
      <span class="right">
        <button class="icon" onclick="shiftMonth(-1)">‹</button>
        <span id="monthLabel" style="color:var(--ink); text-transform:none; letter-spacing:0; font-size:13.5px; min-width:112px; text-align:center"></span>
        <button class="icon" onclick="shiftMonth(1)">›</button>
      </span>
    </h2>
    <div class="cal-grid" id="calGrid" role="group" aria-label="Month calendar"></div>
    <div class="daybox" id="dayBox" aria-live="polite"></div>
  </section>

  <!-- todo ------------------------------------------------------------- -->
  <section class="card">
    <h2>To do <span class="right" id="todoCount" style="color:var(--dim); text-transform:none; letter-spacing:0; font-size:12.5px"></span></h2>
    <div class="todo-add">
      <input id="todoInput" type="text" placeholder="Add a task, press Enter" aria-label="New task">
      <button onclick="addTodo()">Add</button>
    </div>
    <div id="todoList"></div>
  </section>

  <!-- markets ---------------------------------------------------------- -->
  <section class="card" id="marketsCard" hidden>
    <h2>Markets</h2>
    <div id="marketRows"></div>
  </section>

  <!-- verse ------------------------------------------------------------ -->
  <section class="card" id="verseCard" hidden>
    <h2>Verse of the day <span class="right" id="verseFaith"
      style="color:var(--dim); text-transform:none; letter-spacing:0; font-size:12.5px"></span></h2>
    <div id="verseText" style="font-size:15px; line-height:1.7"></div>
    <div id="verseRef" style="color:var(--dim); font-size:13px; margin-top:9px"></div>
  </section>

  <!-- reader ----------------------------------------------------------- -->
  <section class="card news" id="readerCard">
    <h2>Reading
      <span class="right">
        <button onclick="document.getElementById('docFile').click()">Add a document</button>
        <input type="file" id="docFile" accept=".pdf,.txt,.md,.markdown,.text" hidden aria-label="Choose a document to add">
      </span>
    </h2>
    <div id="libraryList"></div>
    <div id="readerPane" hidden style="margin-top:16px; border-top:1px solid var(--line); padding-top:14px">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:10px">
        <strong id="readerTitle" style="font-size:15px"></strong>
        <span id="readerPos" class="meta" style="color:var(--dim); font-size:12.5px"></span>
        <span class="right" style="margin-left:auto; display:flex; gap:7px">
          <button onclick="movePassage(-1)">‹ Back</button>
          <button id="readBtn" class="primary-ish" onclick="readAloud()">▶ Read aloud</button>
          <button onclick="movePassage(1)">Next ›</button>
        </span>
      </div>
      <div style="height:4px; background:var(--panel-2); border-radius:99px; overflow:hidden; margin-bottom:12px">
        <div id="readerBar" style="height:100%; width:0; background:var(--accent)"></div>
      </div>
      <div id="passageText" style="font-size:15px; line-height:1.75; max-height:340px; overflow-y:auto;
           white-space:pre-wrap; background:var(--panel-2); border:1px solid var(--line);
           border-radius:8px; padding:14px"></div>
    </div>
  </section>

  <!-- news ------------------------------------------------------------- -->
  <section class="card news">
    <h2>News
      <span class="right">
        <span class="count" id="newsCount"></span>
        <span id="newsAge" style="color:var(--dim); text-transform:none; letter-spacing:0; font-size:12.5px"></span>
        <button onclick="refreshBriefing(this)">Refresh</button>
      </span>
    </h2>
    <div id="readingPanel"></div>
    <div class="cards" id="newsCards"></div>
  </section>
</main>

<aside id="queuePanel">
  <div class="qhead">
    <strong>Up next</strong>
    <span id="queueCount"></span>
    <button class="icon" onclick="toggleQueue()" title="Close">×</button>
  </div>
  <div id="queueList" role="listbox" aria-label="Play queue"></div>
</aside>

<footer>
  <img id="art" alt="">
  <div class="np">
    <div class="t" id="npTrack">Nothing playing</div>
    <div class="a" id="npArtist">—</div>
  </div>

  <div class="progress">
    <span class="time" id="tElapsed" aria-hidden="true">0:00</span>
    <div class="track" id="seekTrack" role="slider" tabindex="0"
         aria-label="Seek within the track" aria-valuemin="0" aria-valuemax="0"
         aria-valuenow="0" aria-valuetext="not playing"
         title="Click, or focus and use the arrow keys, to jump within the song">
      <div class="fill" id="seekFill"></div>
      <div class="knob" id="seekKnob"></div>
    </div>
    <span class="time" id="tTotal" aria-hidden="true">0:00</span>
  </div>

  <div class="transport">
    <button class="icon" onclick="pb('previous')" title="Previous">⏮</button>
    <button class="icon" id="playBtn" onclick="togglePlay()" title="Play/pause">▶</button>
    <button class="icon" onclick="pb('next')" title="Next">⏭</button>
    <button id="shuffleBtn" onclick="pb('shuffle')" title="Shuffle">🔀</button>
    <button id="repeatBtn" onclick="pb('repeat')" title="Repeat">🔁</button>
    <input type="range" id="vol" min="0" max="100" step="5" title="Volume" aria-label="Music volume">
    <button id="queueBtn" onclick="toggleQueue()" title="Queue">☰ Queue</button>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Off-screen but not hidden from assistive tech: announces changes that are
     otherwise only visible, like a day's contents or the queue loading. -->
<div id="announcer" aria-live="polite" aria-atomic="true"
     style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
            clip:rect(0 0 0 0);white-space:nowrap;border:0"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

let todos = [], month = new Date(), selected = iso(new Date()), monthData = null, saveTimer = null;

function toast(msg, bad){
  const t = $('toast'); t.textContent = msg;
  t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 2600);
}

// Speak something to assistive tech without showing it on screen. Re-setting
// the text is what triggers the announcement, so clear it first when the same
// message could repeat.
function announce(msg){
  const el = $('announcer');
  if(!el) return;
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 50);
}
async function api(path, opts){
  const r = await fetch(path, opts);
  const j = await r.json();
  if(j.ok === false) throw new Error(j.error || 'request failed');
  return j;
}

/* ------------------------------------------------------------- briefing */
async function loadBriefing(){
  try{
    const {data, age_minutes} = await api('/api/briefing-data');
    if(!data){
      $('subtitle').textContent = 'No briefing yet — hit Refresh to build one.';
      $('newsCards').innerHTML = '<div class="empty">Nothing loaded yet.</div>';
      return;
    }
    $('greeting').textContent = data.greeting || 'Good morning';
    const bits = [];
    if(data.term) bits.push(data.term.in_session ? data.term.note : ('No classes — ' + data.term.note));
    if(data.classes?.length) bits.push(`${data.classes.length} class${data.classes.length>1?'es':''} today`);
    if(data.events?.length) bits.push(`${data.events.length} event${data.events.length>1?'s':''} coming up`);
    $('subtitle').textContent = bits.join(' · ') || 'Nothing on today.';

    const w = data.weather;
    $('wx').innerHTML = w ? `
      <div style="font-size:30px">${esc(w.icon||'')}</div>
      <div><div class="temp">${w.temp!=null?Math.round(w.temp)+'°':'—'}</div></div>
      <div class="meta">
        ${esc(w.desc||'')}<br>
        high <strong>${w.high!=null?Math.round(w.high)+'°':'—'}</strong> ·
        low <strong>${w.low!=null?Math.round(w.low)+'°':'—'}</strong> ·
        rain <strong>${w.rain!=null?Math.round(w.rain)+'%':'—'}</strong><br>
        <span style="font-size:12px">${esc(data.city||'')} · ☀ ${esc(w.sunrise||'')} – ${esc(w.sunset||'')}</span>
      </div>` : '<div class="meta">Weather unavailable</div>';

    $('newsAge').textContent = age_minutes == null ? ''
      : age_minutes < 1 ? 'just now'
      : age_minutes < 60 ? `${age_minutes} min ago`
      : `${Math.round(age_minutes/60)} h ago`;

    const cards = (data.headlines || []).map(h => {
      const linked = !!h.link;
      const headline = linked
        ? `<a class="hl" href="${esc(h.link)}" target="_blank" rel="noopener noreferrer">${esc(h.title)}</a>`
        : `<div class="hl">${esc(h.title)}</div>`;
      // The listen button needs the story's details, and stashing them in data
      // attributes keeps them escaped once rather than re-quoted into onclick.
      const foot = linked ? `<div class="story-foot">
          <button class="listen" data-url="${esc(h.link)}" data-title="${esc(h.title)}"
                  data-source="${esc(h.source)}"
                  aria-label="Listen in on: ${esc(h.title)}">🎧 Listen in</button>
        </div>` : '';
      // "read out" rather than "featured": it says what actually happened,
      // and it's the phrase a screen reader will announce.
      const badge = h.spoken ? '<span class="badge">read out</span>' : '';
      return `<div class="story${linked ? '' : ' nolink'}${h.spoken ? ' spoken' : ''}">
        <div class="src">${esc(h.source)}${badge}</div>
        ${headline}
        ${h.summary ? `<div class="sm">${esc(h.summary.slice(0,150))}${h.summary.length>150?'…':''}</div>` : ''}
        ${foot}
      </div>`;
    }).join('');
    $('newsCards').innerHTML = cards || '<div class="empty">No headlines.</div>';

    const readOut = (data.headlines || []).filter(h => h.spoken).length;
    $('newsCount').textContent = readOut ? `${readOut} read out` : '';
  }catch(e){ toast('Briefing failed to load: ' + e.message, true); }
}

/* --------------------------------------------------------------- listen in

   Click a story's "Listen in" and the server fetches the article, has the
   local model talk it through, and synthesises it. That can take the better
   part of a minute, so the button reports which stage it's on rather than
   just spinning.

   The music keeps playing underneath, ducked. We read Cider's current volume
   first and restore to exactly that, rather than to the configured play
   volume - whatever you had it set at is what you want back.             */

const listen = {busy:false, audio:null, duckedFrom:null, btn:null};

// A 44-byte silent WAV. Playing this the instant you click "Listen in" is what
// keeps the browser willing to play the real audio a minute later: a click
// only authorises playback for a few seconds, and fetching the article,
// waiting on the model and synthesising the voice takes far longer than that.
// Without this the audio loads perfectly and then refuses to start.
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4A' +
                   'AAB9AAACABAAZGF0YQAAAAA=';

async function duck(){
  try{
    const now = await api('/api/playback?full=0');
    if(!now.playing) return;                       // nothing to duck
    const cfg = ((await api('/api/config')).config || {}).cider || {};
    // Never duck without knowing what to go back to. If Cider didn't report a
    // volume, fall back to the configured play level - leaving the music stuck
    // quiet is a far worse outcome than restoring it to slightly the wrong spot.
    listen.duckedFrom = typeof now.volume === 'number'
      ? now.volume
      : Number(cfg.play_volume ?? 0.6);
    await api('/api/playback', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'volume', value: Number(cfg.duck_volume ?? 0.1)})});
  }catch(e){ /* no Cider, or it's closed - speaking without ducking is fine */ }
}

// Closing the tab mid-segment would otherwise leave the music ducked, with
// nothing left running to put it back. fetch() is unreliable during unload,
// so this goes out as a beacon.
window.addEventListener('pagehide', () => {
  if(listen.duckedFrom === null) return;
  try{
    navigator.sendBeacon('/api/playback', new Blob(
      [JSON.stringify({action:'volume', value: listen.duckedFrom})],
      {type:'application/json'}));
  }catch(e){}
});

async function unduck(){
  if(listen.duckedFrom === null) return;
  const back = listen.duckedFrom;
  listen.duckedFrom = null;
  try{
    await api('/api/playback', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'volume', value: back})});
  }catch(e){ /* nothing we can do from here */ }
}

function readingPanel(story, state, script, note){
  $('readingPanel').innerHTML = `
    <div class="reading">
      <div class="top">
        <div>
          <div class="who">${esc(story.source)}</div>
          <div class="what">${esc(story.title)}</div>
          <div class="state" id="readingState">${esc(state)}</div>
        </div>
        <div class="acts"><button onclick="stopListening()">Stop</button></div>
      </div>
      ${script ? `<div class="script">${esc(script)}</div>` : ''}
      ${note ? `<div class="note">${esc(note)}</div>` : ''}
    </div>`;
}

function setReadingState(text){
  const el = $('readingState');
  if(el) el.textContent = text;
}

function stopListening(){
  if(listen.audio){
    listen.audio.pause();
    // Only blob: URLs need revoking; the silent unlock clip is a data: URI.
    if(listen.audio.src.startsWith('blob:')) URL.revokeObjectURL(listen.audio.src);
    listen.audio = null;
  }
  unduck();
  $('readingPanel').innerHTML = '';
  if(listen.btn){
    listen.btn.disabled = false;
    listen.btn.removeAttribute('aria-busy');
    listen.btn.textContent = '🎧 Listen in';
    listen.btn = null;
  }
  listen.busy = false;
  announce('Stopped.');
}

async function listenIn(btn){
  if(listen.busy){ toast('Already reading one — stop that first.'); return; }
  const story = {url: btn.dataset.url, title: btn.dataset.title, source: btn.dataset.source};

  // Do this before the first await, while the click still counts as a gesture.
  const audio = new Audio(SILENT_WAV);
  audio.play().catch(() => {});
  listen.audio = audio;

  listen.busy = true;
  listen.btn = btn;
  btn.disabled = true;
  btn.setAttribute('aria-busy', 'true');
  btn.textContent = '🎧 Reading up…';
  readingPanel(story, 'Fetching the article and writing the segment…');
  announce('Reading up on ' + story.title);

  let res;
  try{
    res = await api('/api/listen', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(story)});
  }catch(e){
    toast(e.message, true);
    announce("Couldn't read that one: " + e.message);
    stopListening();
    return;
  }
  if(!listen.busy) return;                      // stopped while we waited

  readingPanel(story, 'Synthesising the voice…', res.script, res.note);
  btn.textContent = '🎧 Speaking…';

  let blob;
  try{
    const r = await fetch('/api/read', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text: res.script})});
    if(!r.ok){
      let msg = 'speech failed';
      try{ msg = (await r.json()).error || msg; }catch(_){}
      throw new Error(msg);
    }
    blob = await r.blob();
  }catch(e){
    toast(e.message, true);
    setReadingState("Couldn't speak that: " + e.message);
    announce("Couldn't speak that one.");
    if(listen.btn){ listen.btn.disabled = false; listen.btn.removeAttribute('aria-busy');
                    listen.btn.textContent = '🎧 Listen in'; listen.btn = null; }
    listen.busy = false;
    return;
  }
  if(!listen.busy){ return; }

  await duck();
  setReadingState('Playing');
  announce('Playing the segment on ' + story.title);

  // Same element we primed on the click - swapping the source keeps the
  // permission it was granted then.
  audio.src = URL.createObjectURL(blob);
  audio.addEventListener('ended', stopListening);
  audio.addEventListener('error', () => {
    toast("Couldn't play that audio", true);
    stopListening();
  });
  try{
    await audio.play();
  }catch(e){
    toast('Playback was blocked by the browser', true);
    setReadingState('Blocked by the browser — click Listen in again.');
    stopListening();
  }
}

// Delegated so cards can be re-rendered without rebinding anything.
document.addEventListener('click', ev => {
  const btn = ev.target.closest('.listen');
  if(btn){ ev.preventDefault(); listenIn(btn); }
});

async function refreshBriefing(btn){
  const old = btn.textContent; btn.textContent = 'Working…'; btn.disabled = true;
  try{ await api('/api/refresh', {method:'POST'}); await loadBriefing(); toast('Briefing refreshed'); }
  catch(e){ toast('Refresh failed: ' + e.message, true); }
  finally{ btn.textContent = old; btn.disabled = false; }
}

/* ------------------------------------------------------------- calendar */
function shiftMonth(n){ month.setMonth(month.getMonth()+n); loadMonth(); }

async function loadMonth(){
  const ym = `${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}`;
  $('monthLabel').textContent = month.toLocaleString(undefined,{month:'long', year:'numeric'});
  try{
    monthData = await api('/api/month?ym=' + ym);
    drawMonth();
  }catch(e){ $('calGrid').innerHTML = ''; toast('Calendar failed: ' + e.message, true); }
}

function drawMonth(){
  const dows = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let html = dows.map(d => `<div class="dow">${d}</div>`).join('');
  // first_weekday is Monday-based, matching the header above.
  // Spacers before the 1st. Non-interactive by design, and hidden from
  // assistive tech so it doesn't announce empty cells.
  html += '<div class="day blank" aria-hidden="true"></div>'.repeat(monthData.first_weekday);

  const today = iso(new Date());
  for(const [date, info] of Object.entries(monthData.days)){
    const n = Number(date.slice(-2));
    const cls = ['day'];
    if(date === today) cls.push('today');
    if(date === selected) cls.push('sel');
    if(!info.in_term) cls.push('out');
    const dots = [
      ...info.classes.slice(0,4).map(() => '<span class="dot cls"></span>'),
      ...info.events.slice(0,4).map(() => '<span class="dot ev"></span>')
    ].join('');

    // A real <button>, not a clickable <div>: keyboard-reachable, and the
    // label spells out what the coloured dots mean, since a screen reader
    // gets nothing from a decorative span.
    const full = new Date(date + 'T00:00:00')
      .toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long'});
    const bits = [];
    if(info.classes.length) bits.push(`${info.classes.length} class${info.classes.length>1?'es':''}`);
    if(info.events.length)  bits.push(`${info.events.length} event${info.events.length>1?'s':''}`);
    if(!info.in_term)       bits.push(info.note);
    const label = full + (bits.length ? ', ' + bits.join(', ') : ', nothing scheduled');

    html += `<button type="button" class="${cls.join(' ')}" data-date="${date}"
               aria-label="${esc(label)}" aria-pressed="${date === selected}"
               onclick="pickDay('${date}')">
               <span class="n" aria-hidden="true">${n}</span>
               <span class="dots" aria-hidden="true">${dots}</span></button>`;
  }
  $('calGrid').innerHTML = html;
  drawDay();
}

function pickDay(d){
  selected = d;
  drawMonth();
  // Selecting a day rewrites the panel below; without this a screen reader
  // user gets no indication anything happened.
  const box = $('dayBox');
  if(box) announce(box.innerText.replace(/\s+/g, ' ').trim().slice(0, 220));
  // Keep focus on the day just chosen - drawMonth() replaced the button.
  const btn = document.querySelector(`.day[data-date="${d}"]`);
  if(btn && document.activeElement !== document.body) btn.focus();
}

function drawDay(){
  const info = monthData?.days?.[selected];
  if(!info){ $('dayBox').innerHTML = ''; return; }
  const d = new Date(selected + 'T00:00:00');
  const title = d.toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long'});

  let body = '';
  // Classes come from the timetable and aren't editable here - only the
  // calendar events are, so only they get a delete control.
  if(info.classes.length){
    body += info.classes.map(c => `<div class="line">
      <span class="t">${esc(c.start)}–${esc(c.end||'')}</span>
      <span>${esc(c.name)}</span>
      ${c.venue ? `<span class="w">${esc(c.venue)}</span>` : ''}</div>`).join('');
  }
  if(info.events.length){
    body += info.events.map(e => `<div class="line">
      <span class="t ev">${esc(e.time || 'all day')}</span>
      <span>${esc(e.summary)}</span>
      ${e.location ? `<span class="w">${esc(e.location)}</span>` : ''}
      <button class="del-ev" title="Remove"
        onclick="removeEvent('${esc(e.id||'')}')"
        style="margin-left:${e.location?'8px':'auto'}; background:none; border:none;
               color:var(--dim); cursor:pointer; font-size:15px; padding:0 4px">×</button>
      </div>`).join('');
  }
  if(!body){
    body = `<div class="empty">${info.in_term ? 'Nothing scheduled.' : 'No classes — ' + esc(info.note) + '.'}</div>`;
  }

  const form = `
    <div id="addRow" style="display:none; gap:7px; margin-top:11px; flex-wrap:wrap">
      <input id="evTime" type="time" aria-label="Event time" style="width:104px; background:var(--panel-2); color:var(--ink);
             border:1px solid var(--line-strong); border-radius:7px; padding:6px 8px; font:inherit; font-size:13px">
      <input id="evName" type="text" placeholder="What is it?" aria-label="Event name" style="flex:1; min-width:130px;
             background:var(--panel-2); color:var(--ink); border:1px solid var(--line);
             border-radius:7px; padding:6px 9px; font:inherit; font-size:13px">
      <input id="evWhere" type="text" placeholder="Where (optional)" aria-label="Event location" style="flex:1; min-width:110px;
             background:var(--panel-2); color:var(--ink); border:1px solid var(--line);
             border-radius:7px; padding:6px 9px; font:inherit; font-size:13px">
      <button onclick="saveEvent()">Save</button>
    </div>
    <button id="addBtn" onclick="showAddRow()" style="margin-top:11px">+ Add an event</button>`;

  $('dayBox').innerHTML = `<h3>${esc(title)}</h3>${body}${form}`;
  const name = $('evName');
  if(name) name.onkeydown = e => { if(e.key === 'Enter') saveEvent(); };
}

function showAddRow(){
  $('addRow').style.display = 'flex';
  $('addBtn').style.display = 'none';
  $('evName').focus();
}

async function saveEvent(){
  const summary = $('evName').value.trim();
  if(!summary){ toast('Give the event a name', true); return; }
  try{
    await api('/api/events/add', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({date: selected, summary,
                            time: $('evTime').value, location: $('evWhere').value.trim()})
    });
    toast('Added to ' + selected);
    await loadMonth();
    loadBriefing();          // the "coming up" count changes too
  }catch(e){ toast('Could not add: ' + e.message, true); }
}

async function removeEvent(id){
  if(!id){ toast('That entry has no id to remove', true); return; }
  try{
    await api('/api/events/delete', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id})
    });
    toast('Removed');
    await loadMonth();
    loadBriefing();
  }catch(e){ toast('Could not remove: ' + e.message, true); }
}

/* ---------------------------------------------------------------- todos */
async function loadTodos(){
  try{ todos = (await api('/api/todos')).todos || []; drawTodos(); }
  catch(e){ $('todoList').innerHTML = '<div class="empty">Could not load tasks.</div>'; }
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{ await api('/api/todos', {method:'POST', headers:{'Content-Type':'application/json'},
                                 body: JSON.stringify(todos)}); }
    catch(e){ toast('Could not save tasks: ' + e.message, true); }
  }, 500);
}
function drawTodos(){
  const open = todos.filter(t => !t.done).length;
  $('todoCount').textContent = todos.length ? `${open} open · ${todos.length - open} done` : '';
  $('todoList').innerHTML = todos.length ? todos.map((t,i) => `
    <div class="todo ${t.done?'done':''}">
      <input type="checkbox" ${t.done?'checked':''} onchange="toggleTodo(${i},this.checked)"
             aria-label="Mark &quot;${esc(t.text)}&quot; as ${t.done ? 'not done' : 'done'}">
      <span class="txt" contenteditable="true" role="textbox" data-i="${i}"
            aria-label="Task: ${esc(t.text)}">${esc(t.text)}</span>
      <button class="del" onclick="delTodo(${i})" aria-label="Delete &quot;${esc(t.text)}&quot;"
              title="Delete">×</button>
    </div>`).join('') : '<div class="empty">Nothing on the list.</div>';

  $('todoList').querySelectorAll('.txt').forEach(el => {
    el.onblur = () => {
      const i = +el.dataset.i, v = el.textContent.trim();
      if(!v){ delTodo(i); return; }
      if(todos[i].text !== v){ todos[i].text = v; queueSave(); }
    };
    el.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } };
  });
}
function addTodo(){
  const input = $('todoInput'), v = input.value.trim();
  if(!v) return;
  todos.unshift({text:v, done:false, created:new Date().toISOString()});
  input.value = ''; drawTodos(); queueSave();
}
function toggleTodo(i, done){ todos[i].done = done; drawTodos(); queueSave(); }
function delTodo(i){ todos.splice(i,1); drawTodos(); queueSave(); }
$('todoInput').onkeydown = e => { if(e.key === 'Enter') addTodo(); };

/* --------------------------------------------------------------- player */
// Cider's now-playing call takes ~3s while the transport fields take ~40ms,
// so the track is fetched sparingly and the buttons stay responsive.
let pollTick = 0, pbBusy = false;

// Position is interpolated locally between polls: asking Cider every second
// would be wasteful, and the clock ticks perfectly well on its own.
let pos = {elapsed: 0, duration: 0, playing: false, at: 0}, seeking = false, lastTrack = '';

const mmss = s => {
  if(s == null || isNaN(s) || s < 0) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${String(sec).padStart(2,'0')}`;
};

function paintProgress(){
  if(seeking) return;                      // don't fight the user's drag
  let elapsed = pos.elapsed;
  if(pos.playing && pos.at) elapsed += (Date.now() - pos.at) / 1000;
  if(pos.duration) elapsed = Math.min(elapsed, pos.duration);
  const pct = pos.duration ? (elapsed / pos.duration) * 100 : 0;
  $('seekFill').style.width = pct + '%';
  $('seekKnob').style.left = pct + '%';
  $('tElapsed').textContent = mmss(elapsed);
  $('tTotal').textContent = mmss(pos.duration);

  // Keep the slider's accessible value in step with the visual one.
  const track = $('seekTrack');
  track.setAttribute('aria-valuemax', Math.round(pos.duration || 0));
  track.setAttribute('aria-valuenow', Math.round(elapsed || 0));
  track.setAttribute('aria-valuetext',
    pos.duration ? `${mmss(elapsed)} of ${mmss(pos.duration)}` : 'not playing');
}

function applyPlayback(p){
  $('playBtn').textContent = p.playing ? '⏸' : '▶';
  $('shuffleBtn').className = p.shuffle ? 'on' : '';
  $('repeatBtn').className = p.repeat ? 'icon on' : 'icon';
  pos.playing = !!p.playing;

  if(p.full){
    $('npTrack').textContent = p.track || 'Nothing playing';
    $('npArtist').textContent = [p.artist, p.album].filter(Boolean).join(' — ') || '—';
    const art = (p.artwork || '').replace('{w}','96').replace('{h}','96');
    $('art').src = art || '';
    $('art').style.visibility = art ? 'visible' : 'hidden';

    if(p.duration != null) pos.duration = p.duration;
    if(p.elapsed != null){ pos.elapsed = p.elapsed; pos.at = Date.now(); }

    // The queue only changes when the track does - no need to re-fetch otherwise.
    const track = (p.track || '') + '|' + (p.artist || '');
    if(track !== lastTrack){
      lastTrack = track;
      if($('queuePanel').classList.contains('open')) loadQueue();
    }
  }
  paintProgress();
}

/* ------------------------------------------------------------- seeking */
function seekFromEvent(e){
  const rect = $('seekTrack').getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  return ratio * (pos.duration || 0);
}
// Arrow keys nudge, Home/End jump to the ends - the keyboard equivalent of
// dragging, and what a screen reader user will expect from role="slider".
$('seekTrack').onkeydown = e => {
  if(!pos.duration) return;
  const step = e.shiftKey ? 30 : 5;
  let target = null;
  if(e.key === 'ArrowRight' || e.key === 'ArrowUp')      target = (pos.elapsed || 0) + step;
  else if(e.key === 'ArrowLeft' || e.key === 'ArrowDown') target = (pos.elapsed || 0) - step;
  else if(e.key === 'Home')                               target = 0;
  else if(e.key === 'End')                                target = pos.duration - 1;
  if(target === null) return;
  e.preventDefault();
  seekTo(Math.max(0, Math.min(pos.duration, target)));
};

async function seekTo(target){
  if(!pos.duration) return;
  seeking = true;
  // Paint the new spot immediately; the server round-trip takes a moment.
  const pct = (target / pos.duration) * 100;
  $('seekFill').style.width = pct + '%';
  $('seekKnob').style.left = pct + '%';
  $('tElapsed').textContent = mmss(target);
  $('seekTrack').setAttribute('aria-valuenow', Math.round(target));
  try{
    const p = await api('/api/playback', {method:'POST', headers:{'Content-Type':'application/json'},
                                          body: JSON.stringify({action:'seek', position: target})});
    seeking = false;
    applyPlayback(p);
    announce(`Jumped to ${mmss(target)}`);
  }catch(err){ seeking = false; toast('Could not seek: ' + err.message, true); }
}

$('seekTrack').onclick = e => { if(pos.duration) seekTo(seekFromEvent(e)); };

/* --------------------------------------------------------------- queue */
function toggleQueue(){
  const panel = $('queuePanel');
  const opening = !panel.classList.contains('open');
  panel.classList.toggle('open', opening);
  $('queueBtn').className = opening ? 'on' : '';
  if(opening) loadQueue();
}

async function loadQueue(){
  const list = $('queueList');
  if(!list.dataset.loaded) list.innerHTML = '<div class="empty" style="padding:14px 16px">Loading…</div>';
  try{
    const q = await api('/api/queue');
    $('queueCount').textContent = q.total > q.items.length
      ? `${q.items.length} of ${q.total}` : `${q.total} track${q.total === 1 ? '' : 's'}`;
    list.innerHTML = q.items.map(it => {
      const now = it.index === q.current;
      const label = `${now ? 'Now playing: ' : 'Play '}${it.name || 'Unknown'}`
                  + (it.artist ? ` by ${it.artist}` : '')
                  + (it.seconds ? `, ${mmss(it.seconds)}` : '');
      return `
      <button type="button" class="qitem ${now ? 'now' : ''}" role="option"
              aria-selected="${now}" aria-label="${esc(label)}" onclick="jumpTo(${it.index})">
        <img src="${esc((it.artwork || '').replace('{w}','72').replace('{h}','72'))}" alt="" aria-hidden="true">
        <span class="qt">
          <span class="qn">${esc(it.name || 'Unknown')}</span>
          <span class="qa">${esc(it.artist || '')}</span>
        </span>
        <span class="qd">${mmss(it.seconds)}</span>
      </button>`;
    }).join('') || '<div class="empty" style="padding:14px 16px">Queue is empty.</div>';
    list.dataset.loaded = '1';
    const now = list.querySelector('.qitem.now');
    if(now) now.scrollIntoView({block:'nearest'});
  }catch(e){
    list.innerHTML = `<div class="empty" style="padding:14px 16px">Could not load the queue — ${esc(e.message)}</div>`;
  }
}

async function jumpTo(index){
  try{
    const p = await api('/api/playback', {method:'POST', headers:{'Content-Type':'application/json'},
                                          body: JSON.stringify({action:'jump', index})});
    applyPlayback(p);
    loadQueue();
  }catch(e){ toast('Could not jump: ' + e.message, true); }
}
async function loadPlayback(full){
  if(pbBusy) return;            // never stack requests behind a slow one
  pbBusy = true;
  try{
    applyPlayback(await api('/api/playback?full=' + (full ? '1' : '0')));
  }catch(e){
    $('npTrack').textContent = 'Cider not connected';
    $('npArtist').textContent = '—';
  }finally{ pbBusy = false; }
}
async function pb(action){
  try{
    const p = await api('/api/playback', {method:'POST', headers:{'Content-Type':'application/json'},
                                          body: JSON.stringify({action})});
    if(action === 'shuffle') toast(p.shuffle ? 'Shuffle on' : 'Shuffle off');
    applyPlayback(p);
  }catch(e){ toast('Cider: ' + e.message, true); }
}
async function togglePlay(){
  const playing = $('playBtn').textContent === '⏸';
  await pb(playing ? 'pause' : 'play');
}
$('vol').oninput = e => {
  clearTimeout($('vol')._t);
  $('vol')._t = setTimeout(() => pb2(e.target.value/100), 250);
};
async function pb2(v){
  try{ await api('/api/playback', {method:'POST', headers:{'Content-Type':'application/json'},
                                   body: JSON.stringify({action:'volume', value:v})}); }
  catch(e){ /* volume is best-effort */ }
}

/* -------------------------------------------------------------- markets */
async function loadMarkets(){
  try{
    const {quotes} = await api('/api/stocks');
    if(!quotes.length){ $('marketsCard').hidden = true; return; }
    $('marketsCard').hidden = false;
    $('marketRows').innerHTML = quotes.map(q => {
      if(q.error) return `<div class="line"><span class="t">${esc(q.symbol)}</span>
        <span style="color:var(--dim)">${esc(q.error)}</span></div>`;
      const up = (q.percent ?? 0) >= 0;
      const col = up ? 'var(--ok)' : 'var(--bad)';
      return `<div class="line">
        <span class="t" style="color:var(--ink); min-width:84px">${esc(q.symbol)}</span>
        <span style="color:var(--dim); font-size:13px">${esc((q.name||'').slice(0,26))}</span>
        <span class="w" style="color:var(--ink)">${esc(q.currency)} ${q.price?.toLocaleString(undefined,{maximumFractionDigits:2}) ?? '—'}</span>
        <span style="color:${col}; min-width:74px; text-align:right; font-variant-numeric:tabular-nums">
          ${up?'▲':'▼'} ${Math.abs(q.percent ?? 0).toFixed(2)}%</span>
        ${q.stale ? '<span class="w" title="last known price — the source was unreachable">stale</span>' : ''}
      </div>`;
    }).join('');
  }catch(e){ $('marketsCard').hidden = true; }
}

/* ---------------------------------------------------------------- verse */
async function loadVerse(){
  try{
    const {verse} = await api('/api/verse');
    if(!verse || !verse.text){ $('verseCard').hidden = true; return; }
    $('verseCard').hidden = false;
    $('verseFaith').textContent = verse.faith_label || '';
    $('verseText').textContent = '“' + verse.text + '”';
    $('verseRef').textContent = (verse.reference || '')
      + (verse.stale ? '  · yesterday’s verse, the source was unreachable' : '');
  }catch(e){ $('verseCard').hidden = true; }
}

/* --------------------------------------------------------------- reader */
let book = null, passage = null, audio = null;

async function loadLibrary(){
  try{
    const {books} = await api('/api/library');
    $('libraryList').innerHTML = books.length ? books.map(b => {
      const pct = Math.round((b.position + 1) / b.passages * 100);
      return `
      <div class="line">
        <button type="button" style="flex:1; cursor:pointer; background:none; border:none;
                text-align:left; font:inherit; color:inherit; padding:0"
                aria-label="Open ${esc(b.title)}, ${pct} percent read"
                onclick="openBook('${b.id}')">
          <strong>${esc(b.title)}</strong>
          <span class="w" style="margin-left:8px">${b.passages} passages · ${pct}% in</span>
        </button>
        <button onclick="deleteBook('${b.id}')" aria-label="Remove ${esc(b.title)}"
          style="background:none; border:none; color:var(--dim); cursor:pointer; font-size:15px">×</button>
      </div>`;
    }).join('')
      : '<div class="empty">No documents yet. Add a PDF, text or markdown file to have it read to you.</div>';
  }catch(e){ $('libraryList').innerHTML = '<div class="empty">Could not read the library.</div>'; }
}

$('docFile').onchange = async e => {
  const file = e.target.files[0];
  if(!file) return;
  toast('Reading ' + file.name + '…');
  try{
    const r = await fetch('/api/library/add', {
      method:'POST', headers:{'X-Filename': encodeURIComponent(file.name)}, body: file
    });
    const j = await r.json();
    if(j.ok === false) throw new Error(j.error);
    toast(`Added “${j.book.title}” — ${j.book.passages} passages`);
    await loadLibrary();
    openBook(j.book.id);
  }catch(err){ toast('Could not add: ' + err.message, true); }
  finally{ e.target.value = ''; }
};

async function openBook(id){
  try{
    const {books} = await api('/api/library');
    book = books.find(b => b.id === id);
    if(!book) return;
    await showPassage(book.position || 0);   // resume where you stopped
    $('readerPane').hidden = false;
    $('readerPane').scrollIntoView({behavior:'smooth', block:'nearest'});
  }catch(e){ toast('Could not open: ' + e.message, true); }
}

async function showPassage(index){
  passage = await api(`/api/passage?id=${book.id}&index=${index}`);
  $('readerTitle').textContent = book.title;
  $('readerPos').textContent = `passage ${passage.index+1} of ${passage.total} · ${passage.progress}%`;
  $('readerBar').style.width = passage.progress + '%';
  $('passageText').textContent = passage.text;
  $('passageText').scrollTop = 0;
  // Remember the spot immediately, so closing the tab doesn't lose it.
  api('/api/library/position', {method:'POST', headers:{'Content-Type':'application/json'},
                                body: JSON.stringify({id: book.id, index: passage.index})})
    .then(() => { book.position = passage.index; loadLibrary(); })
    .catch(() => {});
}

function movePassage(step){
  if(!passage) return;
  const next = passage.index + step;
  if(next < 0 || next >= passage.total){ toast(step > 0 ? 'That’s the end' : 'Already at the start'); return; }
  stopAudio();
  showPassage(next);
}

function stopAudio(){
  if(audio){ audio.pause(); audio = null; }
  $('readBtn').textContent = '▶ Read aloud';
}

async function readAloud(){
  if(audio){ stopAudio(); return; }
  if(!passage) return;
  const btn = $('readBtn');
  btn.textContent = 'Preparing…'; btn.disabled = true;
  try{
    const r = await fetch('/api/read', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id: book.id, index: passage.index})
    });
    if(!r.ok) throw new Error((await r.json()).error || 'speech failed');
    audio = new Audio(URL.createObjectURL(await r.blob()));
    // Roll straight into the next passage, like an audiobook.
    audio.onended = () => {
      audio = null;
      if(passage.index + 1 < passage.total){ showPassage(passage.index + 1).then(readAloud); }
      else { btn.textContent = '▶ Read aloud'; toast('End of document'); }
    };
    await audio.play();
    btn.textContent = '⏸ Stop';
  }catch(e){ toast('Could not read: ' + e.message, true); btn.textContent = '▶ Read aloud'; }
  finally{ btn.disabled = false; }
}

async function deleteBook(id){
  try{
    await api('/api/library/delete', {method:'POST', headers:{'Content-Type':'application/json'},
                                      body: JSON.stringify({id})});
    if(book && book.id === id){ stopAudio(); $('readerPane').hidden = true; book = null; }
    loadLibrary(); toast('Removed');
  }catch(e){ toast('Could not remove: ' + e.message, true); }
}

/* ----------------------------------------------------------------- init */
loadBriefing();
loadMonth();
loadTodos();
loadMarkets();
loadVerse();
loadLibrary();
loadPlayback(true);
// Full poll every 5s (~180ms) keeps the position honest; the bar itself is
// redrawn locally 4x a second so it moves smoothly in between.
setInterval(() => { pollTick++; loadPlayback(true); }, 5000);
setInterval(paintProgress, 250);

// Installable app. Registered from the root so its scope covers /dashboard.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
